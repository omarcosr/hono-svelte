version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/e2e", "/examples/playground"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the engines.node floor (Node 24 LTS), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
