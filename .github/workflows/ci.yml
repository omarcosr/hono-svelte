name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node floor (LTS) and current.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx publint

  compat:
    # Peer-dependency floor and ceiling: the exact minimums declared in
    # peerDependencies, and the newest releases inside the same majors.
    name: compat (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: minimum
            install: hono@4.13.8 svelte@5.57.0 vite@8.3.0
          - deps: latest
            install: hono@^4 svelte@^5 vite@^8 @sveltejs/vite-plugin-svelte@^7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: npm install --no-save ${{ matrix.install }}
      - run: npm ls hono svelte vite @sveltejs/vite-plugin-svelte
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

  e2e:
    # Browser suite (Playwright): the contract tests against hono-svelte on
    # Node, on Bun and in `vite` dev, with SvelteKit as the reference, plus the
    # playground app end to end — see e2e/README.md.
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: npm install && npm run build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run build
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  scaffold:
    # Drift guard: proves `init --full` yields an app that installs,
    # typechecks and builds against THIS commit (hono-svelte resolved from
    # the repo, not from the registry).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: npm install
      - run: npm run build
      - run: node dist/cli.js init --full --app=.tmp-app
      - run: npm install hono-svelte@file:../.. --no-fund --no-audit
        working-directory: .tmp-app
      - run: npm run typecheck
        working-directory: .tmp-app
      - run: bun run build
        working-directory: .tmp-app

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The example's build script chains `bun run build:client && bun run build:server`.
      - uses: oven-sh/setup-bun@v2
      - name: Build package (dist required by the example)
        run: npm install && npm run build
      - name: Install example
        run: npm install
        working-directory: examples/playground
      - name: Typecheck example
        run: npm run typecheck
        working-directory: examples/playground
      - name: Build example
        run: npm run build
        working-directory: examples/playground
