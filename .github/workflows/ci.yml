name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx publint

  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build package (dist exigido pelo exemplo)
        run: npm install && npm run build
      - name: Install example
        run: npm install
        working-directory: examples/playground
      - name: Typecheck example
        run: npm run typecheck
        working-directory: examples/playground
      - name: Build example
        run: npm run build
        working-directory: examples/playground