name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx publint

  scaffold:
    # Drift guard: proves `init --full` yields an app that installs,
    # typechecks and builds against THIS commit (hono-svelte resolved from
    # the repo, not from the registry). Locally validated end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: npm install
      - run: npm run build
      - run: node dist/cli.js init --full --app=.tmp-app
      - run: npm install hono-svelte@file:../.. --no-fund --no-audit
        working-directory: .tmp-app
      - run: npm run typecheck
        working-directory: .tmp-app
      - run: bun run build
        working-directory: .tmp-app

  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The example's build script chains `bun run build:client && bun run build:server`.
      - uses: oven-sh/setup-bun@v2
      - name: Build package (dist exigido pelo exemplo)
        run: npm install && npm run build
      - name: Install example
        run: npm install
        working-directory: examples/playground
      - name: Typecheck example
        run: npm run typecheck
        working-directory: examples/playground
      - name: Build example
        run: npm run build
        working-directory: examples/playground